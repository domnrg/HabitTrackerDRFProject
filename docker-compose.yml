version: "3.9"

services:
  db:
    image: postgres:16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env

  redis:
    image: redis:7.2.0
    restart: always

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/habits
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env

  celery:
    build: .
    command: celery -A config worker -l info
    depends_on:
      - redis
      - db
    env_file:
      - ./.env

  celery-beat:
    build: .
    command: celery -A config beat -l info
    depends_on:
      - redis
      - db
    env_file:
      - ./.env

volumes:
  postgres_data:

